---
services:
  wreckfest-server:
    build: .
    # Local tag distinct from the upstream image so `docker compose up` always uses our
    # built image (with Xvfb/gosu) instead of silently pulling the outdated upstream one.
    # Rebuild with `docker compose build` after changing the Dockerfile.
    image: wreckfest2-docker-server:local
    ports:
      - "30100:30100/udp"
    volumes:
      - ./config:/home/steam/wf2-config
      - ./logs:/home/steam/logs
      - ./wf2-server:/home/steam/wf2-server
    environment:
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - WINEDLLOVERRIDES=mscoree=
      - STEAMAPPDIR=/home/steam/wf2-server
      - SERVERCONFIGDIR=/home/steam/wf2-config
      - STEAMAPPID=3519390
      - XLOGDIR=/home/steam/logs/x
      - WINELOGDIR=/home/steam/logs/wine
      - WFLOGFILEDIR=/home/steam/logs/wf
      - WRAPPERDIR=/home/steam/wrapper
      - DISPLAY=:99
    privileged: true
    restart: unless-stopped
    # Enable interactive mode for console access
    stdin_open: true
    tty: true
    # entry.sh (root) fixes bind-mount ownership, starts Xvfb, then drops to steam via gosu
    entrypoint: ["./entry.sh"]

  config-editor:
    build: ./config-editor
    image: wreckfest2-config-editor:local
    ports:
      # Bind to localhost by default; set EDITOR_BIND=0.0.0.0 to expose on the LAN
      # (also set EDITOR_USER/EDITOR_PASS if you expose it).
      - "${EDITOR_BIND:-127.0.0.1}:8085:8080"
    volumes:
      - ./config:/config
      - ./wf2-server:/game:ro
    environment:
      - EDITOR_USER=${EDITOR_USER:-}
      - EDITOR_PASS=${EDITOR_PASS:-}
      - MAX_BACKUPS=${MAX_BACKUPS:-50}
    restart: unless-stopped
